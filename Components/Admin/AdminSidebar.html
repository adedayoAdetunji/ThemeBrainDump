<script>
    
document.addEventListener("DOMContentLoaded", () => {


  // Base fallback menu
  let ASIDE = [
    {
      ltId: "dashboard",
      menuName: "Dashboard",
      icon: "fa-solid fa-chart-pie",
      routePath: "/admin-end/dashboard",
      menuLevel: 1
    }
  ];

  const sidebar = document.getElementById("admin-sidebar");
  const backdrop = document.getElementById("admin-sidebar-backdrop");
  const closeBtn = document.getElementById("admin-sidebar-close-btn");
  const openBtn = document.getElementById("admin-sidebar-open-btn"); // e.g. hamburger button in header

  // --- Mobile Drawer Controls ---
  function openMobileSidebar() {
    if (!sidebar) return;
    sidebar.classList.remove("-translate-x-full");
    backdrop?.classList.remove("hidden");
    document.body.style.overflow = "hidden";
  }

  function closeMobileSidebar() {
    if (!sidebar) return;
    sidebar.classList.add("-translate-x-full");
    backdrop?.classList.add("hidden");
    document.body.style.overflow = "";
  }

  closeBtn?.addEventListener("click", closeMobileSidebar);
  backdrop?.addEventListener("click", closeMobileSidebar);
  openBtn?.addEventListener("click", openMobileSidebar);

  // --- Active Route Detection ---
  function isRouteActive(routePath) {
    if (!routePath) return false;
    const currentPath = window.location.pathname.toLowerCase();
    const targetPath = routePath.toLowerCase();
    return currentPath === targetPath || (targetPath !== "/" && currentPath.endsWith(targetPath));
  }

  // --- Recursive Menu Renderer ---
  function renderMenu() {
    const nav = document.getElementById("mainNav");
    if (!nav) return;

    nav.innerHTML = ASIDE
      .filter(item => item.menuLevel === 1)
      .map(item => renderMenuItem(item, 0))
      .join("");
  }

  function renderMenuItem(item, level = 0) {
    const hasChildren = Array.isArray(item.children) && item.children.length > 0;
    const submenuId = `submenu-${item.ltId}`;
    const fullRoute = item.routePath ? `${siteHostAddress}${item.routePath}` : "#";
    const active = isRouteActive(item.routePath);

    // Padding hierarchy by nesting level
    const paddingClass = level === 0 
      ? "px-4 py-3 text-xs" 
      : level === 1 
        ? "pl-8 pr-4 py-2.5 text-xs" 
        : "pl-12 pr-4 py-2 text-xs";

    // Modern active vs inactive styles
    const stateClasses = active
      ? "bg-primary text-white shadow-md shadow-indigo-500/20 font-bold"
      : "text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold";

    let html = `
      <div class="menu-item-wrapper">
        <a 
          href="${fullRoute}" 
          class="menu-link flex w-full items-center justify-between rounded-2xl ${paddingClass} ${stateClasses} transition-all"
          data-menu-id="${item.ltId}" 
          ${hasChildren ? `data-submenu="${submenuId}"` : ""}
        >
          <span class="flex items-center gap-3 truncate">
            <i class="${item.icon || 'fa-solid fa-layer-group'} w-4 text-center ${active ? 'text-white' : 'text-slate-400 dark:text-slate-500'}"></i>
            <span class="truncate">${item.menuName}</span>
          </span>
          ${hasChildren ? `
            <i class="fa-solid fa-chevron-down text-[10px] transition-transform duration-200" id="chevron-${item.ltId}"></i>
          ` : ""}
        </a>
    `;

    if (hasChildren) {
      // If a child is active, keep submenu opened by default
      const childActive = item.children.some(c => isRouteActive(c.routePath));

      html += `
        <div 
          class="submenu ${childActive ? '' : 'hidden'} space-y-1 my-1 overflow-hidden transition-all duration-200" 
          id="${submenuId}"
        >
          ${item.children.map(child => renderMenuItem(child, level + 1)).join("")}
        </div>
      `;
    }

    html += `</div>`;
    return html;
  }

  // --- Fetch API Menus ---
  async function loadMenus() {
    try {
      const response = await fetch(`${BASE_URL}/menus/is-navigation?packageName=ThemeBrainDump`, {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${LW_TOKEN}`,
          "Accept": "application/json"
        }
      });

      const { responseData, responseCategory } = await response.json();

      if (responseCategory === 200 && Array.isArray(responseData)) {
        // Prevent duplicate initial items if API includes Dashboard
        const hasApiDashboard = responseData.some(m => (m.menuName || '').toLowerCase() === 'dashboard');
        if (hasApiDashboard) {
          ASIDE = responseData;
        } else {
          ASIDE.push(...responseData);
        }
        renderMenu();
      }
    } catch (error) {
      console.error("Failed to load navigation menus:", error);
      renderMenu(); // Fallback to base dashboard
    }
  }

  // --- Accordion Event Delegation ---
  document.addEventListener("click", (e) => {
    const menuLink = e.target.closest("[data-submenu]");
    if (!menuLink) return;

    e.preventDefault();

    const submenuId = menuLink.dataset.submenu;
    const targetSubmenu = document.getElementById(submenuId);
    if (!targetSubmenu) return;

    const targetChevron = menuLink.querySelector(".fa-chevron-down");
    const isOpening = targetSubmenu.classList.contains("hidden");

    // Scope peer lookup to parent container
    const parentContainer = menuLink.closest(".submenu") || document.getElementById("mainNav");
    const peerSubmenus = parentContainer.querySelectorAll(":scope > .menu-item-wrapper > .submenu:not(.hidden)");

    // Close sibling submenus
    peerSubmenus.forEach(sub => {
      if (sub.id !== submenuId) {
        sub.classList.add("hidden");
        const peerChevron = sub.previousElementSibling?.querySelector(".fa-chevron-down");
        peerChevron?.classList.remove("rotate-180");
      }
    });

    // Toggle current submenu
    if (isOpening) {
      targetSubmenu.classList.remove("hidden");
      targetChevron?.classList.add("rotate-180");
    } else {
      targetSubmenu.classList.add("hidden");
      targetChevron?.classList.remove("rotate-180");
    }
  });

  loadMenus();
});
    
</script>
