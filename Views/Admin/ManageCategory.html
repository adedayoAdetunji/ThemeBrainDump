    <script>
        
  document.addEventListener('DOMContentLoaded', () => {
  // Internal State
  let categoriesData = [];
  let filteredData = [];
  let currentPage = 1;
  const itemsPerPage = 8;

  // DOM Elements
  const tableBody = document.getElementById('categories-table-body');
  const countIndicator = document.getElementById('categories-count-indicator');
  const paginationContainer = document.getElementById('categories-pagination');
  const searchInput = document.getElementById('category-search');
  const openModalBtn = document.getElementById('btn-open-category-modal');
  const modal = document.getElementById('admin-category-modal');
  const modalForm = document.getElementById('admin-category-modal-form');
  const modalTitle = document.getElementById('admin-category-modal-title');

  // Input Fields
  const idInput = document.getElementById('modal-category-id');
  const nameInput = document.getElementById('modal-category-name');
  const descInput = document.getElementById('modal-category-desc');
  const statusInput = document.getElementById('modal-category-status');
  
  updateHeader('Workspace', "Manage Categories");
 

  function slugify(text) {
    return text
      .toString()
      .toLowerCase()
      .trim()
      .replace(/[\s\W-]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  // --- Modal Visibility Controls ---
  function openCategoryModal(ltId = null) {
    modalForm.reset();
    idInput.value = '';

    if (ltId) {
      const category = categoriesData.find(c => String(c.ltId) === String(ltId));
      if (!category) return;

      modalTitle.textContent = 'Edit Category';
      idInput.value = category.ltId;
      nameInput.value = category.categoryName || '';
      descInput.value = category.categoryDescription || '';
      if (statusInput) {
        statusInput.value = (category.status === 'isActive' || category.status === 'Active') ? 'Active' : 'Archived';
      }
    } else {
      modalTitle.textContent = 'Create New Category';
      if (statusInput) statusInput.value = 'Active';
    }

    modal.classList.remove('hidden');
  }

  function closeCategoryModal() {
    modal.classList.add('hidden');
  }

  // Hook up close buttons and background click
  modal.querySelectorAll('.btn-close-modal').forEach(btn => {
    btn.addEventListener('click', closeCategoryModal);
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeCategoryModal();
  });

  if (openModalBtn) {
    openModalBtn.addEventListener('click', () => openCategoryModal());
  }


  // --- Fetch API ---
  async function fetchCategories() {
    tableBody.innerHTML = `
      <tr>
        <td colspan="6" class="py-12 text-center text-slate-400">
          <i class="fa-solid fa-spinner fa-spin text-base mr-2"></i> Loading categories...
        </td>
      </tr>
    `;

    try {
      const response = await fetch(`${BASE_URL}/blogs/categories`, {
        headers: {
          'Accept': 'application/json',
          'Authorization': `Bearer ${LW_TOKEN}`
        }
      });

      const result = await response.json();
      if (result.responseCategory == 200) {
        categoriesData = result.responseData || [];
        applyFilter();
      } else {
        throw new Error(result.responseResult || 'Failed to fetch categories');
      }
    } catch (error) {
      console.error(error);
      tableBody.innerHTML = `
        <tr>
          <td colspan="6" class="py-8 text-center text-rose-500 font-semibold">
            <i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Unable to load categories from server.
          </td>
        </tr>
      `;
    }
  }

  // --- Filter & Search ---
  function applyFilter() {
    const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
    filteredData = categoriesData.filter(item => {
      const name = (item.categoryName || '').toLowerCase();
      const desc = (item.categoryDescription || '').toLowerCase();
      const ltId = String(item.ltId || '');
      return name.includes(query) || desc.includes(query) || ltId.includes(query);
    });

    currentPage = 1;
    renderTable();
  }

  if (searchInput) {
    searchInput.addEventListener('input', applyFilter);
  }

  // --- Render Table & Pagination ---
  function renderTable() {
    const totalItems = filteredData.length;
    const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

    if (currentPage > totalPages) currentPage = totalPages;

    const startIdx = (currentPage - 1) * itemsPerPage;
    const currentSlice = filteredData.slice(startIdx, startIdx + itemsPerPage);

    if (countIndicator) {
      const shownCount = currentSlice.length;
      countIndicator.textContent = `Showing ${shownCount > 0 ? startIdx + 1 : 0}-${startIdx + shownCount} of ${totalItems} categories`;
    }

    if (currentSlice.length === 0) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="6" class="py-12 text-center text-slate-400">No categories found matching criteria.</td>
        </tr>
      `;
      renderPaginationControls(totalPages);
      return;
    }

    tableBody.innerHTML = currentSlice.map(item => {
      const slug = slugify(item.categoryName);
      
      // Normalize active state (supports 'isActive', 'Active', or boolean 1)
      const isActive = item.status === 'isActive' || item.status === 'Active' || item.status == 1;
    
      const badgeStyle = isActive
        ? 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/40 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800 hover:bg-emerald-100'
        : 'bg-rose-50 text-rose-600 dark:bg-rose-950/40 dark:text-rose-400 border border-rose-200 dark:border-rose-800 hover:bg-rose-100';
    
      return `
        <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">
          <td class="px-6 py-4 font-bold text-slate-900 dark:text-white">
            <div class="flex flex-col">
              <span class="text-xs font-bold">${item.categoryName}</span>
              ${item.categoryDescription ? `<span class="text-[10px] text-slate-400 font-normal line-clamp-1">${item.categoryDescription}</span>` : ''}
            </div>
          </td>
          <td class="px-4 py-4 font-mono text-[11px] text-slate-500 dark:text-slate-400">/${slug}</td>
          <td class="px-4 py-4 text-slate-700 dark:text-slate-300 font-semibold">${item.articlesCount ?? 0}</td>
          
          <!-- Interactive Toggle Status Badge -->
          <td class="px-4 py-4">
            <button 
              type="button" 
              data-action="toggle-status" 
              data-id="${item.ltId}" 
              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider transition-all cursor-pointer ${badgeStyle}"
              title="Click to toggle status"
            >
              <i class="fa-solid fa-circle text-[5px]"></i>
              <span>${isActive ? 'Active' : 'Inactive'}</span>
            </button>
          </td>
    
          <td class="px-6 py-4 text-right">
            <div class="inline-flex items-center gap-1.5">
              <button type="button" data-action="edit" data-id="${item.ltId}" class="p-1.5 rounded-lg text-slate-400 hover:text-primary hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Edit">
                <i class="fa-solid fa-pen-to-square pointer-events-none"></i>
              </button>
              <button type="button" data-action="delete" data-id="${item.ltId}" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors" title="Delete">
                <i class="fa-solid fa-trash-can pointer-events-none"></i>
              </button>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    renderPaginationControls(totalPages);
  }

  function renderPaginationControls(totalPages) {
    if (!paginationContainer) return;
    if (totalPages <= 1) {
      paginationContainer.innerHTML = '';
      return;
    }

    let buttons = '';

    buttons += `
      <button 
        type="button"
        data-page="${currentPage - 1}"
        ${currentPage === 1 ? 'disabled class="opacity-30 cursor-not-allowed"' : 'class="hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300"'} 
        class="page-btn w-7 h-7 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-800 text-[10px]"
      >
        <i class="fa-solid fa-chevron-left pointer-events-none"></i>
      </button>
    `;

    for (let p = 1; p <= totalPages; p++) {
      const activeClass = p === currentPage
        ? 'bg-primary text-white font-bold border-primary shadow-sm'
        : 'border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800';

      buttons += `
        <button 
          type="button"
          data-page="${p}" 
          class="page-btn w-7 h-7 flex items-center justify-center rounded-lg border text-xs font-semibold ${activeClass}"
        >
          ${p}
        </button>
      `;
    }

    buttons += `
      <button 
        type="button"
        data-page="${currentPage + 1}"
        ${currentPage === totalPages ? 'disabled class="opacity-30 cursor-not-allowed"' : 'class="hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300"'} 
        class="page-btn w-7 h-7 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-800 text-[10px]"
      >
        <i class="fa-solid fa-chevron-right pointer-events-none"></i>
      </button>
    `;

    paginationContainer.innerHTML = buttons;
  }
  
  // --- Toggle Category Active Status ---
    async function toggleCategoryActive(ltId, btnElement) {
      const originalHtml = btnElement.innerHTML;
      btnElement.disabled = true;
      btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-[10px]"></i> Updating...';
    
      try {
        const response = await fetch(`${BASE_URL}/blogs/categories/${encodeURIComponent(ltId)}/toggle-active`, {
          method: 'PATCH',
          headers: {
            'Accept': 'application/json',
            'Authorization': `Bearer ${LW_TOKEN}`
          }
        });
    
        const res = await response.json();
    
        if (res.responseCategory == 200 || res.responseCode == 200) {
          // Find local category in memory and flip its status
          const category = categoriesData.find(c => String(c.ltId) === String(ltId));
          if (category) {
            const currentlyActive = category.status === 'isActive' || category.status === 'Active' || category.status == 1;
            category.status = currentlyActive ? 'Inactive' : 'isActive';
          }
    
          // Re-render table with updated state
          renderTable();
    
          Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'success',
            title: res.responseResult || 'Status updated',
            showConfirmButton: false,
            timer: 1500
          });
        } else {
          throw new Error(res.responseResult || 'Failed to update category status.');
        }
      } catch (err) {
        console.error(err);
        Swal.fire('Error', err.message || 'Unable to update status', 'error');
        btnElement.innerHTML = originalHtml;
        btnElement.disabled = false;
      }
    }

  // Event Delegation for Table Actions (Edit & Delete)
    tableBody.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
    
      const action = btn.dataset.action;
      const ltId = btn.dataset.id;
    
      if (action === 'edit') {
        openCategoryModal(ltId);
      } else if (action === 'delete') {
        deleteCategory(ltId);
      } else if (action === 'toggle-status') {
        toggleCategoryActive(ltId, btn);
      }
    });

  // Event Delegation for Pagination
  if (paginationContainer) {
    paginationContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.page-btn:not([disabled])');
      if (!btn) return;

      const targetPage = parseInt(btn.dataset.page, 10);
      if (targetPage && targetPage !== currentPage) {
        currentPage = targetPage;
        renderTable();
      }
    });
  }

  // --- Form Submit (Create / Edit) ---
  if (modalForm) {
    modalForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const ltId = idInput.value;
      const isEdit = Boolean(ltId);
      const submitBtn = modalForm.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;

      const payload = {
        categoryName: nameInput.value.trim(),
        categoryDescription: descInput.value.trim()
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Saving...';

      try {
        const endpoint = isEdit
          ? `${BASE_URL}/blogs/categories/${ltId}`
          : `${BASE_URL}/blogs/categories`;

        const response = await fetch(endpoint, {
          method: !isEdit ? 'POST' : "PATCH",
          headers: {
            'Accept': 'application/json',
            'Authorization': `Bearer ${LW_TOKEN}`
          },
          body: JSON.stringify(payload)
        });

        const res = await response.json();

        if (res.responseCategory == 200 || res.responseCode == 2006) {
          Swal.fire({
            icon: 'success',
            title: isEdit ? 'Category Updated' : 'Category Registered',
            text: res.responseResult || 'Operation completed successfully.',
            timer: 1600,
            showConfirmButton: false
          });

          closeCategoryModal();
          await fetchCategories();
        } else {
          Swal.fire('Error', res.responseResult || 'Failed to process request.', 'error');
        }
      } catch (err) {
        console.error(err);
        Swal.fire('Error', 'A network connection issue occurred.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    });
  }

  // --- Delete Category Method ---
  async function deleteCategory(ltId) {
    const category = categoriesData.find(c => String(c.ltId) === String(ltId));
    const catName = category ? category.categoryName : 'this category';

    const { isConfirmed } = await Swal.fire({
      title: 'Delete Category?',
      html: `Are you sure you want to delete <strong class="text-slate-900 dark:text-white">"${catName}"</strong>?<br><span class="text-xs text-rose-500">All linked post references might need to be reassigned.</span>`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#e11d48',
      cancelButtonColor: '#64748b',
      confirmButtonText: 'Yes, delete'
    });

    if (!isConfirmed) return;

    try {
      const response = await fetch(`${BASE_URL}/blogs/categories/${ltId}`, {
        method: 'DELETE',
        headers: {
          'Accept': 'application/json',
          'Authorization': `Bearer ${LW_TOKEN}`
        }
      });

      const res = await response.json();

      if (res.responseCategory == 200) {
        Swal.fire('Deleted!', res.responseResult || 'Category removed.', 'success');
        await fetchCategories();
      } else {
        Swal.fire('Failed', res.responseResult || 'Could not delete category.', 'error');
      }
    } catch (err) {
      console.error(err);
      Swal.fire('Error', 'Unable to execute delete request.', 'error');
    }
  }

  // Boot on DOM Ready
  fetchCategories();
});
        
    </script>
